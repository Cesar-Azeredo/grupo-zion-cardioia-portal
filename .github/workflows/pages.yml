# Publica o portal no GitHub Pages. Lint, testes e build rodam antes; se
# qualquer um falhar, o job de build falha e o deploy não acontece.
name: Publica no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Imagem fixa, não ubuntu-latest: o GitHub passa o latest para Ubuntu 26 a
    # partir de 19/10/2026, e o deploy não deve mudar de comportamento sem um
    # commit. Atualizar a versão aqui é uma decisão explícita.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências (versões do package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04 # mesmo motivo do job build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
